<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efe6cf">
<title>大明仕途录 V4.1 · 微信兼容版</title>
<link rel="stylesheet" href="./style.css?v=wechat-4102">
<style>
html,body{margin:0;min-height:100%;background:#f3ead5}
#boot{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#f3ead5;color:#382b22;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;text-align:center;padding:28px}
#boot h1{font-size:28px;letter-spacing:.12em;margin:0 0 12px}#boot p{font-size:14px;color:#75695b;line-height:1.7}
#boot .spin{width:28px;height:28px;border:3px solid #d8c7a8;border-top-color:#7d2929;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}#boot.error .spin{display:none}#boot.error h1{font-size:22px}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><h1>大明仕途录</h1><p id="bootText">正在载入仕途……</p></div>
<main id="app"></main>
<script>
(function(){
 var boot=document.getElementById('boot'),txt=document.getElementById('bootText');
 function fail(msg){if(!boot)return;boot.className='error';boot.querySelector('h1').innerHTML='载入失败';txt.innerHTML='微信浏览器兼容错误：'+String(msg)+'<br><br>请点击右上角刷新页面，或在系统浏览器中打开。'}
 window.__mingBootOk=function(){if(boot&&boot.parentNode)boot.parentNode.removeChild(boot)};
 window.onerror=function(msg,url,line){fail(msg+'（'+line+'）');return false};
 window.addEventListener&&window.addEventListener('unhandledrejection',function(e){fail(e&&e.reason?e.reason:'未知脚本错误')});
 setTimeout(function(){if(document.getElementById('boot'))fail('游戏脚本启动超时')},7000);
})();
</script>
<script src="./app.js?v=wechat-4102"></script>
</body></html>
